name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/*

jobs:
  build:
    name: Build
    env:
      RUSTFLAGS: "-D warnings -C opt-level=z -C debuginfo=1"
      X86_64_PC_WINDOWS_MSVC_OPENSSL_DIR: c:/vcpkg/installed/x64-windows
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        uses: ./.github/actions/setup-tools
        with:
          tools: actionlint rust protoc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}

      - name: Check lockfile
        run: mise run ci:lock

      - name: Validate workflows
        run: mise run ci:workflows

      - name: Check formatting
        run: mise run ci:fmt

      - name: Cache vcpkg's artifacts
        uses: actions/cache@v4
        if: matrix.os == 'windows-latest'
        with:
          path: c:/vcpkg/installed
          key: vcpkg-${{ runner.os }}-v0
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Run tests
        run: mise run ci:test

      - name: Build workspace
        run: mise run ci:build

      - name: Build router
        run: mise run ci:router
