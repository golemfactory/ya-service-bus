name: Set up repository tools
description: Install selected tools at versions defined in mise.toml

inputs:
  tools:
    description: Space-separated mise tool names to install
    required: true
  working-directory:
    description: Directory containing mise.toml
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install mise tools
      uses: jdx/mise-action@v4
      with:
        version: 2026.7.5
        install_args: ${{ inputs.tools }}
        working_directory: ${{ inputs.working-directory }}
        cache: true
        cache_key_prefix: ya-service-bus-mise-v1

    - name: Select mise protoc
      if: contains(inputs.tools, 'protoc')
      shell: bash
      run: echo "PROTOC=$(mise which protoc)" >> "$GITHUB_ENV"
